<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mon Journal de Bord</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6">
  <h1 class="text-3xl font-bold text-blue-600 mb-4">Mon Journal de Bord</h1>
  <p class="text-gray-700 mb-6">Semaine 2 - Je construis mon interface</p>

  <div class="bg-white rounded-lg shadow p-4 w-full max-w-md mb-6">
    <h2 class="text-xl font-semibold mb-2">Nouvelle entree</h2>
    <form>
      <label class="block text-gray-600 mb-1">Qu'as-tu fait aujourd'hui ?</label>
      <textarea class="w-full border border-gray-300 rounded p-2 mb-3" rows="3" placeholder="Ecris ton entree ici..."></textarea>
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Enregistrer</button>
    </form>
  </div>

  <div class="w-full max-w-md">
    <h2 class="text-xl font-semibold mb-2">Mes entrees</h2>

    <div class="bg-white rounded-lg shadow p-4 mb-3">
      <p class="text-sm text-gray-400">2 octobre</p>
      <p class="text-gray-700">Jour 15 - ajout de la liste des entrees du journal.</p>
    </div>

    <div class="bg-white rounded-lg shadow p-4 mb-3">
      <p class="text-sm text-gray-400">1 octobre</p>
      <p class="text-gray-700">Jour 14 - premier vrai formulaire HTML sans JavaScript.</p>
    </div>

    <div class="bg-white rounded-lg shadow p-4 mb-3">
      <p class="text-sm text-gray-400">17 septembre</p>
      <p class="text-gray-700">Jour 1 - demarrage du parcours, premier commit.</p>
    </div>
  </div>
</body>
</html>
