<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen p-6">
  <header class="max-w-3xl mx-auto mb-8">
    <p class="text-stone-400 text-sm tracking-widest uppercase">Journal de bord</p>
    <h1 class="font-serif italic text-4xl mt-2">Mon dashboard</h1>
  </header>
  <main class="max-w-3xl mx-auto grid grid-cols-1 sm:grid-cols-3 gap-4">
    <section class="bg-stone-800 rounded-3xl p-6">
      <h2 class="text-stone-400 text-sm">Heures cette semaine</h2>
      <p class="text-4xl mt-2">--</p>
    </section>
    <section class="bg-stone-800 rounded-3xl p-6">
      <h2 class="text-stone-400 text-sm">Commits</h2>
      <p class="text-4xl mt-2">--</p>
    </section>
    <section class="bg-stone-800 rounded-3xl p-6">
      <h2 class="text-stone-400 text-sm">Exercices termines</h2>
      <p class="text-4xl mt-2">1 / 15</p>
    </section>
    <section class="bg-stone-800 rounded-3xl p-6">
      <h2 class="text-stone-400 text-sm">Dernieres entrees</h2>
      <p class="text-stone-300 mt-2">Bientot ici</p>
    </section>
  </main>
</body>
</html>
